<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Погодный информер</title>
  <link rel="icon" href="data:;base64,=" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="theme-default">
  <main class="weather-app">
    <section class="weather-card" aria-labelledby="app-title">
      <h1 id="app-title">Погодный информер</h1>

      <form id="weather-form" class="weather-form">
        <label for="city-input" class="sr-only">Введите город</label>
        <input
          id="city-input"
          type="text"
          name="city"
          placeholder="Например, Москва"
          autocomplete="off"
          required
        />
        <button type="submit">Получить прогноз</button>
      </form>
      <div class="favorites-controls">
        <button id="add-favorite-button" type="button">Добавить в избранное</button>
      </div>
      <section class="favorites-section" aria-labelledby="favorites-title">
        <h3 id="favorites-title">Избранные города</h3>
        <div id="favorites-list" class="favorites-list"></div>
      </section>

      <p id="status-message" class="status-message" aria-live="polite"></p>

      <article id="weather-result" class="weather-result hidden" aria-live="polite">
        <h2 id="city-name"></h2>
        <img id="weather-icon" src="" alt="" width="100" height="100" />
        <p id="temperature" class="temperature"></p>
        <p id="description" class="description"></p>
        <div id="weather-metrics" class="weather-metrics"></div>
      </article>

      <section class="forecast-section" aria-labelledby="hourly-title">
        <h3 id="hourly-title">Почасовой прогноз (24 часа)</h3>
        <div id="hourly-forecast" class="forecast-scroll"></div>
      </section>

      <section class="forecast-section" aria-labelledby="daily-title">
        <h3 id="daily-title">Прогноз на 5 дней</h3>
        <div id="five-day-forecast" class="forecast-grid"></div>
      </section>

      <section class="chart-section" aria-labelledby="chart-title">
        <h3 id="chart-title">График температуры (24 часа)</h3>
        <div class="chart-wrapper">
          <canvas id="temperature-chart" aria-label="График температуры по времени" role="img"></canvas>
        </div>
      </section>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="js/api.js"></script>
  <script src="js/state.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
