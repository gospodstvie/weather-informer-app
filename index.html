<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Погодный информер</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="theme-default">
  <main class="weather-app">
    <section class="weather-card" aria-labelledby="app-title">
      <h1 id="app-title">Погодный информер</h1>

      <form id="weather-form" class="weather-form">
        <label for="city-input" class="sr-only">Введите город</label>
        <input
          id="city-input"
          type="text"
          name="city"
          placeholder="Например, Москва"
          autocomplete="off"
          required
        />
        <button type="submit">Получить прогноз</button>
      </form>

      <p id="status-message" class="status-message" aria-live="polite"></p>

      <article id="weather-result" class="weather-result hidden" aria-live="polite">
        <h2 id="city-name"></h2>
        <img id="weather-icon" src="" alt="" width="100" height="100" />
        <p id="temperature" class="temperature"></p>
        <p id="description" class="description"></p>
      </article>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
